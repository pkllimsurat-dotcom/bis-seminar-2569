<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ลงทะเบียนอบรม/สัมมนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.3.3/dist/email.min.js"></script>
<style>
  :root{
    --blue:#3B6E8F; --blue-dark:#274D63; --blue-tint:#E8F0F4;
    --green:#2F7D4F; --green-dark:#1F5A38; --green-tint:#E9F5EE;
    --amber:#B8860B; --amber-dark:#8C6508; --amber-tint:#FBF3E1;
    --red:#D81533; --red-dark:#A80F27; --red-tint:#FCE9EB;
    --black:#1A1A1A; --grey:#777D7D; --grey-light:#ACAFAF;
    --line:#E7E7E8; --bg-card:#FAFAFA; --bg:#F2F4F5;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--black);font-family:'Sarabun','Noto Sans Thai',sans-serif;}
  h1,h2,h3{font-family:'Sarabun',sans-serif;}
  svg.ic{width:20px;height:20px;flex:none;vertical-align:-4px;}
  svg.ic-lg{width:34px;height:34px;}

  .topbar{background:var(--blue-dark);color:#fff;position:relative;overflow:hidden;}
  .topbar::after{content:"";position:absolute;top:-70px;right:-70px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none;}
  .topbar-inner{max-width:760px;margin:0 auto;padding:30px 24px 26px;position:relative;}
  .plate{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.06em;color:#fff;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);padding:4px 12px;border-radius:20px;margin-bottom:14px;}
  .topbar h1{font-size:24px;line-height:1.4;margin:0 0 6px;font-weight:700;}
  .topbar p{margin:0;color:#DCE7EC;font-size:14px;line-height:1.7;}
  .topbar .meta{margin-top:16px;display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:#fff;}
  .topbar .meta div{display:flex;align-items:center;gap:7px;}

  .wrap{max-width:760px;margin:0 auto;padding:26px 24px 80px;}

  .stepper{display:flex;justify-content:space-between;margin-bottom:28px;}
  .step{flex:1;text-align:center;position:relative;font-size:12px;color:var(--grey-light);}
  .step:not(:last-child)::after{content:"";position:absolute;top:13px;left:60%;right:-40%;height:2px;background:var(--line);}
  .step.done:not(:last-child)::after{background:var(--green);}
  .step .num{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;background:var(--bg-card);font-weight:600;font-size:12px;color:var(--grey-light);position:relative;z-index:2;}
  .step.active .num{border-color:var(--blue);color:var(--blue);background:#fff;}
  .step.done .num{border-color:var(--green);background:var(--green);color:#fff;}
  .step.active{color:var(--blue);font-weight:600;}
  .step.done{color:var(--green);}

  .card{background:var(--bg-card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:var(--radius);padding:26px;margin-bottom:16px;}
  .card.accent-green{border-left-color:var(--green);}
  .card.accent-amber{border-left-color:var(--amber);}
  .card.accent-red{border-left-color:var(--red);}
  .card h2{font-size:17px;margin:0 0 4px;color:var(--blue-dark);display:flex;align-items:center;gap:9px;}
  .card .sub{font-size:13px;color:var(--grey);margin:0 0 18px;}

  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 11px;border-radius:20px;}
  .pill-green{background:var(--green-tint);color:var(--green-dark);}
  .pill-amber{background:var(--amber-tint);color:var(--amber-dark);}
  .pill-red{background:var(--red-tint);color:var(--red-dark);}

  label{display:block;font-size:13.5px;font-weight:600;color:var(--blue-dark);margin-bottom:6px;}
  .req::after{content:" *";color:var(--red);}
  input[type=text],input[type=tel],input[type=email],textarea,select{
    width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;
    font-family:inherit;font-size:14.5px;background:#fff;color:var(--black);transition:border-color .15s;
  }
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);}
  .field{margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.grid2{grid-template-columns:1fr;}}
  .hint{font-size:12px;color:var(--grey);margin-top:5px;}

  .choice-row{display:flex;gap:12px;margin-bottom:6px;flex-wrap:wrap;}
  .choice-row .choice-btn{min-width:140px;}
  @media (max-width:560px){ .choice-row .choice-btn{flex:1 1 100%;} }
  .choice-btn{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:13px;text-align:center;cursor:pointer;background:#fff;font-weight:500;font-size:14px;transition:.15s;color:var(--black);display:flex;align-items:center;justify-content:center;gap:8px;}
  .choice-btn:hover{border-color:var(--blue);}
  .choice-btn.sel{border-color:var(--blue);background:var(--blue);color:#fff;}
  .choice-btn.sel svg{stroke:#fff;}

  .search-box{position:relative;}
  .results{border:1.5px solid var(--line);border-top:none;max-height:260px;overflow-y:auto;background:#fff;border-radius:0 0 10px 10px;position:relative;z-index:5;}
  .results .opt{padding:11px 13px;cursor:pointer;font-size:14px;border-bottom:1px solid var(--line);}
  .results .opt:hover{background:var(--blue-tint);}
  .results .opt b{color:var(--blue-dark);}
  .results .opt .addr{font-size:12px;color:var(--grey);display:block;margin-top:2px;}
  .results .none{padding:13px;font-size:13.5px;color:var(--grey);}

  .company-card{background:var(--blue-tint);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:10px;}
  .company-card .name{font-weight:700;color:var(--blue-dark);margin-bottom:4px;}
  .flag-edited{display:inline-block;font-size:11px;background:var(--amber);color:#fff;padding:1px 8px;border-radius:20px;margin-left:6px;}

  .food-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media (max-width:560px){.food-grid{grid-template-columns:1fr;}}
  .check-item{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-size:14px;}
  .check-item input{width:16px;height:16px;accent-color:var(--blue);}
  .check-item.checked{border-color:var(--green);background:var(--green-tint);}

  .attendee-item{border:1.5px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;background:#fff;}
  .attendee-item .ai-name{font-weight:700;color:var(--blue-dark);font-size:14.5px;}
  .attendee-item .ai-meta{font-size:12.5px;color:var(--grey);margin-top:3px;line-height:1.6;}
  .attendee-item .ai-actions{display:flex;gap:10px;flex:none;margin-left:12px;}
  .ai-actions span{font-size:12px;color:var(--blue);cursor:pointer;text-decoration:underline;white-space:nowrap;}
  .ai-actions span.del{color:var(--red);}

  .price-note{background:var(--green-tint);border:1px solid #CDE8DA;color:var(--green-dark);border-radius:10px;padding:10px 13px;font-size:13px;margin-top:8px;}

  .rate-table{margin-top:16px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;}
  .rate-table-title{background:var(--blue-dark);color:#fff;font-size:13px;font-weight:600;padding:9px 14px;}
  .rate-row{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:6px;padding:10px 14px;font-size:13.5px;border-top:1px solid var(--line);align-items:center;}
  .rate-row:first-of-type{border-top:none;}
  .rate-row span:not(:first-child){text-align:center;font-weight:600;color:var(--blue-dark);}
  .rate-row.rate-head{background:var(--blue-tint);font-size:12px;color:var(--grey);font-weight:600;}
  .rate-row.rate-head span:not(:first-child){color:var(--grey);font-weight:600;}

  .notice-box{background:var(--amber-tint);border:1px solid #F0DCA6;color:var(--amber-dark);border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:14px;line-height:1.6;}

  .btnrow{display:flex;justify-content:space-between;gap:12px;margin-top:8px;}
  button{font-family:inherit;font-size:14.5px;font-weight:600;border:none;border-radius:10px;padding:13px 22px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px;justify-content:center;}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:disabled{background:var(--grey-light);cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--blue-dark);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--blue);}
  .btn-success{background:var(--green);color:#fff;}
  .btn-success:hover{background:var(--green-dark);}
  .btn-add{background:#fff;color:var(--blue);border:1.5px dashed var(--blue);width:100%;padding:13px;}
  .btn-add:hover{background:var(--blue-tint);}

  .review-block{margin-bottom:18px;}
  .review-block h3{font-size:13px;color:var(--blue-dark);margin:0 0 8px;text-transform:uppercase;letter-spacing:.04em;font-weight:700;display:flex;align-items:center;gap:7px;}
  .review-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px;}
  .review-row span:first-child{color:var(--grey);flex:none;}
  .review-row span:last-child{font-weight:500;text-align:right;}
  .review-attendee{border:1.5px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px;background:#fff;}

  .pdpa-box{background:var(--blue-tint);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:6px;}
  .pdpa-box label{display:flex;gap:11px;font-size:13.5px;color:var(--black);font-weight:400;align-items:flex-start;cursor:pointer;}
  .pdpa-box input{width:18px;height:18px;flex:none;margin-top:1px;accent-color:var(--blue);}

  .success{text-align:center;padding:40px 20px;}
  .success .seal{width:72px;height:72px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;}
  .success h2{color:var(--green-dark);font-size:22px;}
  .success .regid{display:inline-block;margin-top:10px;background:var(--blue-dark);color:#FFD37A;padding:6px 16px;border-radius:20px;font-size:14px;letter-spacing:.04em;}

  .center-card{text-align:center;padding:44px 24px;}
  .center-card svg{color:var(--grey-light);margin-bottom:10px;}

  footer{text-align:center;font-size:12px;color:var(--grey);padding:20px 0 40px;}
  footer a{color:var(--grey);}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--black);color:#fff;padding:11px 20px;border-radius:20px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}

  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 14px;animation:spin 0.8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .modal-overlay{position:fixed;inset:0;background:rgba(26,26,26,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal{background:#fff;border-radius:var(--radius);padding:26px;max-width:380px;width:100%;}
  .modal h3{margin:0 0 14px;color:var(--blue-dark);font-size:16px;}
  .err-text{font-size:12px;color:var(--red);margin-top:5px;}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner" id="heroInner">
    <div class="plate">กำลังโหลดข้อมูล...</div>
    <h1>&nbsp;</h1>
  </div>
</div>

<div class="wrap">
  <div class="stepper" id="stepper"></div>
  <div id="app"></div>
  <footer>
    ข้อมูลเบอร์โทรและอีเมลใช้เพื่อการประสานงานจัดอบรม/สัมมนาเท่านั้น และจะไม่ถูกนำไปใช้เพื่อวัตถุประสงค์อื่น<br>
    <span style="cursor:pointer;text-decoration:underline;" onclick="openAdmin()">สำหรับเจ้าหน้าที่</span>
  </footer>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="adminModal">
  <div class="modal" id="adminModalInner">
    <h3>เข้าสู่ระบบเจ้าหน้าที่</h3>
    <p style="font-size:13px;color:var(--grey);margin-top:-8px;">สำหรับผู้ดูแลระบบ จัดการหลักสูตรและนำออกข้อมูลผู้ลงทะเบียน กรุณาไปที่หน้า <b>admin.html</b></p>
    <div class="btnrow">
      <button class="btn-ghost" onclick="closeAdmin()">ปิด</button>
      <a href="admin.html" style="text-decoration:none;"><button class="btn-primary">ไปหน้าเจ้าหน้าที่ →</button></a>
    </div>
  </div>
</div>

<script>
/* ============== Firebase ==============
   ดูขั้นตอนเต็มในไฟล์ SETUP.md
*/
const firebaseConfig = {
  apiKey: "AIzaSyDbrDLqmg8CEs_wsaVyGwq5f2dlvlmq3M8",
  authDomain: "bis-seminar-2569.firebaseapp.com",
  projectId: "bis-seminar-2569",
  storageBucket: "bis-seminar-2569.firebasestorage.app",
  messagingSenderId: "656020881419",
  appId: "1:656020881419:web:7a4a896efaf8efedf1470e"
};
let fbReady = false;
let db = null, auth = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  auth = firebase.auth();
  fbReady = firebaseConfig.apiKey !== "YOUR_API_KEY";
}catch(e){ console.warn('Firebase init failed', e); }

/* ============== EmailJS (ส่งอีเมลยืนยันให้ผู้ลงทะเบียนอัตโนมัติ) ==============
   ใช้ EmailJS เพราะ Firebase โปรเจกต์นี้อยู่แผน Spark (ฟรี) ซึ่งไม่รองรับ Cloud Functions
   สำหรับส่งอีเมลจากฝั่งเซิร์ฟเวอร์ — EmailJS ทำงานฝั่งเบราว์เซอร์ได้โดยไม่ต้องอัปเกรดแผน
   สมัครฟรีที่ https://www.emailjs.com (ฟรี 200 อีเมล/เดือน) แล้วใส่ค่า 3 ตัวด้านล่าง ดู SETUP.md
*/
const EMAILJS_CONFIG = {
  publicKey: "YOUR_EMAILJS_PUBLIC_KEY",
  serviceId: "YOUR_EMAILJS_SERVICE_ID",
  templateId: "YOUR_EMAILJS_TEMPLATE_ID"
};
let emailjsReady = false;
try{
  if(window.emailjs && EMAILJS_CONFIG.publicKey !== "YOUR_EMAILJS_PUBLIC_KEY"){
    emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
    emailjsReady = true;
  }
}catch(e){ console.warn('EmailJS init failed', e); }

/* ============== ไอคอน (เส้นมินิมอล) ============== */
const ICONS = {
  building:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18"/><path d="M9 21v-4h6v4M9 8h1M9 12h1M14 8h1M14 12h1"/></svg>',
  users:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M2 20c0-3.3 3-5.5 7-5.5s7 2.2 7 5.5"/><circle cx="17" cy="8" r="2.4"/><path d="M17 11.3c2.5.4 4 2.2 4 4.7"/></svg>',
  check:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4M22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12"/></svg>',
  lock:'<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  warn:'<svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 2.6 17.5a1.8 1.8 0 0 0 1.6 2.7h15.6a1.8 1.8 0 0 0 1.6-2.7L13.7 3.9a1.8 1.8 0 0 0-3.4 0z"/></svg>',
  bus:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M3 11h18M7 19v-1M17 19v-1"/><circle cx="7.5" cy="16" r="0" /></svg>',
  car:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l1.5-5a2 2 0 0 1 2-1.5h9a2 2 0 0 1 2 1.5L20 13"/><rect x="2.5" y="13" width="19" height="5" rx="1.5"/><circle cx="7" cy="18.5" r="1.3"/><circle cx="17" cy="18.5" r="1.3"/></svg>',
  bed:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v7M3 18v2M21 18v2M3 13h18"/></svg>',
  food:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v8M4 2v4a2 2 0 0 0 4 0V2M8 10v12M17 2c-2 1-3 3-3 6s1 4 3 4M17 2v18"/></svg>',
  mail:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  info:'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>'

  try{
    const doc = await db.collection('courses').doc(courseId).get();
    if(!doc.exists){ courseError='notfound'; renderHero(); render(); return; }
    course = doc.data();
    course.id = courseId;
    renderHero();
    render();
  }catch(e){
    console.warn(e);
    courseError='error'; renderHero(); render();
  }
}

function renderHero(){
  const el = document.getElementById('heroInner');
  if(!course){
    el.innerHTML = `<div class="plate">${ICONS.info} ระบบลงทะเบียนอบรม/สัมมนา</div><h1>ไม่สามารถโหลดข้อมูลหลักสูตรได้</h1>`;
    return;
  }
  el.innerHTML = `
    <div class="plate">${ICONS.building} ชมรมอุตสาหกรรมบางปู</div>
    <h1>${escapeHtml(course.name||'')}</h1>
    ${course.subtitle?`<p>${escapeHtml(course.subtitle)}</p>`:''}
    <div class="meta">
      ${course.dateText?`<div>${ICONS.info} ${escapeHtml(course.dateText)}</div>`:''}
      ${course.venue?`<div>${ICONS.building} ${escapeHtml(course.venue)}</div>`:''}
      ${course.duration?`<div>${ICONS.bed} ${escapeHtml(course.duration)}</div>`:''}
    </div>`;
}

  return { fullname:'', nickname:'', position:'', phone:'', email:'',
           room:'single', travel:'', food:[], allergyNote:'' };
}
let draft = blankAttendee();

const STEPS = ['สถานะสมาชิก','ข้อมูลบริษัท','ผู้เข้าร่วม','ตรวจสอบ & ส่ง'];

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

function renderStepper(){
  const el=document.getElementById('stepper');
  if(step>4){ el.style.display='none'; return; }
  el.style.display='flex';
  el.innerHTML = STEPS.map((s,i)=>{
    const n=i+1;
    let cls='step';
    if(n<step) cls+=' done';
    else if(n===step) cls+=' active';
    return `<div class="${cls}"><div class="num">${n<step?'✓':n}</div>${s}</div>`;
  }).join('');
}

function priceFor(member, room){
  if(!course) return 0;
  if(member){ return room==='single' ? Number(course.priceMemberSingle||0) : Number(course.priceMemberDouble||0); }
  return room==='single' ? Number(course.priceNonMemberSingle||0) : Number(course.priceNonMemberDouble||0);
}

function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============== RENDER ============== */
function render(){
  const app=document.getElementById('app');
  const stepperEl=document.getElementById('stepper');

  if(courseError){
    stepperEl.style.display='none';
    app.innerHTML = viewCourseError();
    return;
  }
  if(!course){
    stepperEl.style.display='none';
    app.innerHTML = `<div class="card center-card"><div class="spinner"></div><p style="color:var(--grey);">กำลังโหลดข้อมูลหลักสูตร...</p></div>`;
    return;
  }
  if(course.isOpen===false){
    stepperEl.style.display='none';
    app.innerHTML = viewClosed();
    return;
  }

  renderStepper();
  if(step===1) app.innerHTML = viewMember();
  else if(step===2) app.innerHTML = viewCompany();
  else if(step===3) app.innerHTML = viewAttendees();
  else if(step===4) app.innerHTML = viewReview();
  else if(step===5) app.innerHTML = viewSuccess();
  bindEvents();
}

/* ============== EVENTS ============== */
function bindEvents(){
  if(step===1){
    document.querySelectorAll('.choice-btn[data-val]').forEach(b=>{
      b.onclick=()=>{ isMember = b.dataset.val==='true'; render(); };
    });
    const n=document.getElementById('next1');
    if(n) n.onclick=()=>{ step=2; render(); };
  }
  if(step===2){
    document.getElementById('back2').onclick=()=>{ step=1; render(); };
    if(isMember){
      const inp=document.getElementById('companySearch');
      inp.oninput=(e)=>{ searchTerm=e.target.value; renderSearchResults(searchTerm); };
      inp.onfocus=()=>renderSearchResults(searchTerm);
      const addr=document.getElementById('companyAddr');
      if(addr) addr.oninput=(e)=>{
        company.address=e.target.value;
        company.edited = company.address.trim() !== company.originalAddress.trim();
      };
    } else {
      document.getElementById('manualName').oninput=(e)=>company.name=e.target.value;
      document.getElementById('manualAddr').oninput=(e)=>company.address=e.target.value;
    }
    document.getElementById('next2').onclick=()=>{
      if(!isMember){
        company.name = document.getElementById('manualName').value.trim();
        company.address = document.getElementById('manualAddr').value.trim();
        if(!company.name || !company.address){ toast('กรุณากรอกชื่อบริษัทและที่อยู่ให้ครบถ้วน'); return; }
      }
      if(!company.name){ toast('กรุณาเลือกบริษัทของท่าน'); return; }
      step=3; render();
    };
  }
  if(step===3){
    document.getElementById('back3').onclick=()=>{ step=2; render(); };
    document.querySelectorAll('.choice-btn[data-room]').forEach(b=>{
      b.onclick=()=>{ draft.room=b.dataset.room; render(); };
    });
    document.querySelectorAll('.choice-btn[data-travel]').forEach(b=>{
      b.onclick=()=>{ draft.travel=b.dataset.travel; render(); };
    });
    document.querySelectorAll('[data-food]').forEach(c=>{
      c.onchange=(e)=>{
        const k=e.target.dataset.food;
        if(e.target.checked) draft.food.push(k);
        else draft.food = draft.food.filter(x=>x!==k);
        render();
      };
    });
    ['f_fullname','f_nickname','f_position','f_phone','f_email'].forEach(id=>{
      const el=document.getElementById(id);
      el.oninput=(e)=>{ draft[id.slice(2)]=e.target.value; };
    });
    document.getElementById('f_allergy').oninput=(e)=>draft.allergyNote=e.target.value;

    document.getElementById('saveAttendee').onclick=()=>{
      if(!draft.fullname.trim() || !draft.position.trim() || !draft.phone.trim() || !draft.email.trim()){
        toast('กรุณากรอกข้อมูลที่จำเป็น (มีเครื่องหมาย *) ให้ครบถ้วน'); return;
      }
      if(!draft.travel){ toast('กรุณาเลือกวิธีการเดินทาง'); return; }
      if(editingIndex!==null){ attendees[editingIndex]={...draft}; editingIndex=null; }
      else { attendees.push({...draft}); }
      draft = blankAttendee();
      toast('บันทึกข้อมูลผู้เข้าร่วมแล้ว');
      render();
    };
    document.querySelectorAll('[data-edit]').forEach(s=>{
      s.onclick=()=>{ editingIndex=parseInt(s.dataset.edit); draft={...attendees[editingIndex]}; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    });
    document.querySelectorAll('[data-del]').forEach(s=>{
      s.onclick=()=>{ attendees.splice(parseInt(s.dataset.del),1); render(); };
    });
    const n3=document.getElementById('next3');
    if(n3) n3.onclick=()=>{ step=4; render(); };
  }
  if(step===4){
    document.getElementById('back4').onclick=()=>{ step=3; render(); };
    document.getElementById('pdpaCheck').onchange=(e)=>{ pdpaChecked=e.target.checked; render(); };
    const sub=document.getElementById('submitAll');
    if(sub) sub.onclick=submitRegistration;
  }
  if(step===5){
    document.getElementById('newReg').onclick=()=>{
      isMember=null; company={name:'',address:'',originalAddress:'',edited:false};
      attendees=[]; draft=blankAttendee(); pdpaChecked=false; searchTerm=''; editingIndex=null;
      step=1; render(); window.scrollTo({top:0,behavior:'smooth'});
    };
  }
}

function renderSearchResults(term){
  const box=document.getElementById('searchResults');
  if(!term || term.trim().length<1){ box.innerHTML=''; return; }
  const t=term.trim().toLowerCase();
  const matches = COMPANIES.filter(c=>c.name.toLowerCase().includes(t)).slice(0,12);
  if(matches.length===0){
    box.innerHTML = `<div class="results"><div class="none">ไม่พบบริษัทนี้ในฐานข้อมูล — หากท่านเป็นสมาชิกใหม่ กรุณาติดต่อเจ้าหน้าที่ชมรมฯ</div></div>`;
    return;
  }
  box.innerHTML = `<div class="results">` + matches.map(c=>`
    <div class="opt" data-name="${escapeHtml(c.name)}"><b>${escapeHtml(c.name)}</b><span class="addr">${escapeHtml(c.address)}</span></div>
  `).join('') + `</div>`;
  box.querySelectorAll('.opt').forEach(o=>{
    o.onclick=()=>{
      const c = COMPANIES.find(x=>x.name===o.dataset.name);
      company = { name:c.name, address:c.address, originalAddress:c.address, edited:false };
      searchTerm = c.name;
      render();
    };
  });
}

/* ============== SUBMIT / STORAGE ============== */
function genRegId(){
  const d=new Date();
  const stamp = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  const rnd = Math.floor(Math.random()*9000+1000);
  return 'REG-'+stamp+'-'+rnd;
}

function submitRegistration(){
  const regId = genRegId();
  const payload = {
    regId, courseId: course.id, courseName: course.name, submittedAt: new Date().toISOString(),
    isMember, company, attendees,
    total: attendees.reduce((s,a)=>s+priceFor(isMember,a.room),0)
  };

  // เก็บสำเนาไว้ในเครื่อง (fallback กรณีไม่มีอินเทอร์เน็ต/Firebase ยังไม่พร้อม)
  try{
    const key = 'reg_backup_'+course.id;
    const all = JSON.parse(localStorage.getItem(key)||'[]');
    all.push(payload);
    localStorage.setItem(key, JSON.stringify(all));
  }catch(e){}

  // เขียนข้อมูลเข้า Firestore แบบ realtime แยกตามหลักสูตร (courses/{courseId}/registrations/{regId})
  if(fbReady && db){
    db.collection('courses').doc(course.id).collection('registrations').doc(regId).set(payload)
      .catch(err=>console.warn('บันทึกขึ้น Firestore ไม่สำเร็จ (ข้อมูลยังอยู่ในเครื่องนี้):', err));
  } else {
    console.warn('ยังไม่ได้ตั้งค่า Firebase — ข้อมูลถูกบันทึกไว้เฉพาะในเครื่องนี้เท่านั้น ดู SETUP.md');
  }

  sendConfirmationEmails(payload);

  lastRegId = regId;
  step = 5;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============== EMAIL CONFIRMATION (EmailJS) ==============
   ส่งอีเมลยืนยันให้ผู้เข้าร่วมทุกท่าน แสดงข้อมูลที่กรอกย้อนกลับไป
   ต้องตั้งค่า EMAILJS_CONFIG ด้านบนก่อน (ดู SETUP.md) — ถ้ายังไม่ตั้งค่า ระบบจะข้ามการส่งอีเมลโดยไม่กระทบการลงทะเบียน
*/
function buildSummaryText(payload, a){
  return [
    `หลักสูตร/สัมมนา: ${payload.courseName}`,
    `เลขที่ลงทะเบียน: ${payload.regId}`,
    `บริษัท: ${payload.company.name}`,
    `ชื่อ-สกุล: ${a.fullname}${a.nickname?' ('+a.nickname+')':''}`,
    `ตำแหน่ง: ${a.position}`,
    `เบอร์โทร: ${a.phone}`,
    `อีเมล: ${a.email}`,
    `ห้องพัก: ${a.room==='single'?'พักเดี่ยว':'พักคู่'}`,
    `การเดินทาง: ${a.travel==='bus'?'รถบัสที่ชมรมฯ จัดให้':'พาหนะส่วนตัว'}`,
    `ข้อมูลอาหาร: ${(a.food||[]).map(k=>FOOD_OPTS.find(o=>o.k===k).label).join(', ')||'ไม่มีข้อกำหนด'}${a.allergyNote?' / แพ้: '+a.allergyNote:''}`,
    `ค่าลงทะเบียน: ${priceFor(payload.isMember,a.room).toLocaleString()} บาท`
  ].join('\n');
}

async function sendConfirmationEmails(payload){
  if(!emailjsReady){ console.warn('EmailJS ยังไม่ได้ตั้งค่า — ข้ามการส่งอีเมลยืนยัน (ดู SETUP.md)'); return; }
  for(const a of payload.attendees){
    if(!a.email) continue;
    try{
      await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, {
        to_email: a.email,
        to_name: a.fullname,
        course_name: payload.courseName,
        reg_id: payload.regId,
        summary: buildSummaryText(payload, a)
      });
    }catch(e){ console.warn('ส่งอีเมลยืนยันไม่สำเร็จสำหรับ', a.email, e); }
  }
}
